<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juga con Nosotros - Ancla Handball</title>
    <link rel="icon" type="image/png" href="./Imagenes/logo.png">
    <link rel="stylesheet" href="styles1.css">
  </head>
  <body>

    <!-- Menú Desplegable Superior -->
    <nav class="navbar">
      <div class="dropdown">
        <button class="dropdown-btn">Menú ☰</button>
        <div class="dropdown-content">
          <a href="./index.html">Inicio</a>
          <a href="./plantel.html">Plantel</a>
          <a href="./liga.html">Liga</a>
          <a href="./fotos.html">Sponsors</a>
        </div>
      </div>
    </nav>

    <!-- Título Centrado con Estilo Deportivo -->
    <h1>Sumate a Jugar con Nosotros</h1>

    <!-- Formulario de Inscripción -->
    <div class="form-container">
      <h2>Formulario de Inscripción</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="nombre">Nombre y Apellido:</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
          <label for="edad">Edad:</label>
          <input type="number" id="edad" name="edad" min="10" max="99" required>
        </div>

        <div class="form-group">
          <label for="posicion">Posición en la cancha:</label>
          <select id="posicion" name="posicion" required>
            <option value="" disabled selected>Selecciona tu posición</option>
            <option value="Arquero">Arquero / Arquera</option>
            <option value="Central">Central</option>
            <option value="Lateral Izquierdo">Lateral Izquierdo</option>
            <option value="Lateral Derecho">Lateral Derecho</option>
            <option value="Extremo Izquierdo">Extremo Izquierdo</option>
            <option value="Extremo Derecho">Extremo Derecho</option>
            <option value="Pivote">Pivote</option>
            <option value="Sin experiencia">Aún no sé / Principiante</option>
          </select>
        </div>

        <div class="form-group">
          <label for="telefono">Número de Teléfono:</label>
          <input type="tel" id="telefono" name="telefono" required>
        </div>

        <button type="submit" class="btn-enviar">Enviar Postulación</button>
      </form>
    </div>

    <footer>
      <p>© 2024 Ancla Handball. Todos los derechos reservados.</p>
    </footer>

    <!-- Vinculación del JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
